<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planes de Suscripción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<main class="container py-5">
    <h1 class="text-center mb-5">Planes de Suscripción</h1>

    <div class="row g-4">

        <div class="col-12 col-md-4">
            <div class="card h-100 text-center bg-light">
                <div class="card-body d-flex flex-column">
                    <h3>Plan Estudiante</h3>
                    <p>Ideal para comenzar</p>
                    <div class="display-4 fw-bold">$9.99</div>
                    <p>/mes</p>
                    <button class="btn btn-outline-primary mt-auto">Elegir Plan</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card h-100 text-center bg-primary text-white border-warning border-3">
                <div class="card-header bg-warning text-dark fw-bold">
                    Más Popular
                </div>
                <div class="card-body d-flex flex-column">
                    <h3>Plan Pro VIP</h3>
                    <p>Para usuarios avanzados</p>
                    <div class="display-4 fw-bold">$24.99</div>
                    <p>/mes</p>
                    <button class="btn btn-warning mt-auto">Elegir Plan</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card h-100 text-center bg-dark text-white">
                <div class="card-body d-flex flex-column">
                    <h3>Plan Institucional</h3>
                    <p>Para equipos y centros</p>
                    <div class="display-4 fw-bold">$79.99</div>
                    <p>/mes</p>
                    <button class="btn btn-outline-light mt-auto">Elegir Plan</button>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
